<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FolioBind — Automatic PDF & DOCX Document Merger</title>
    <meta name="description" content="Upload multiple PDF and Word (.docx) documents to automatically merge, reorder, inspect, and download them as a single unified file." />
    <meta property="og:title" content="FolioBind — Automatic PDF & DOCX Document Merger" />
    <meta property="og:description" content="Upload multiple PDF and Word (.docx) documents to automatically merge, reorder, inspect, and download them as a single unified file." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body style="background-color: #1E272E; color: #00CEC9; margin: 0; min-height: 100vh;">
    <div id="root">
      <div style="min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; background-color: #1E272E; color: #00CEC9; font-family: -apple-system, BlinkMacSystemFont, sans-serif; gap: 12px;">
        <div style="font-size: 24px; font-weight: bold; letter-spacing: -0.5px;">FolioBind</div>
        <div style="font-size: 13px; color: #0984E3; font-weight: 600;">Loading workspace...</div>
      </div>
    </div>
    <script>
      // If served directly from GitHub Pages root, automatically redirect to compiled /docs/
      if (window.location.hostname.endsWith('github.io')) {
        var path = window.location.pathname;
        if (!path.endsWith('/docs/') && !path.endsWith('/docs')) {
          var target = path.replace(/\/?$/, '/docs/');
          window.location.replace(target);
        }
      }

      // Fallback message if docs folder is missing or cannot load
      window.addEventListener('error', function(e) {
        if (e.target && e.target.tagName === 'SCRIPT' && e.target.src && e.target.src.indexOf('.tsx') !== -1) {
          var root = document.getElementById('root');
          if (root) {
            root.innerHTML = '<div style="min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; background-color: #1E272E; color: #00CEC9; font-family: sans-serif; padding: 24px; text-align: center;"><h1 style="color: #00CEC9; font-size: 24px; margin-bottom: 8px;">FolioBind — GitHub Pages Setup</h1><p style="color: #F5F6FA; max-width: 540px; font-size: 14px; line-height: 1.6;">In your repository <strong>Settings → Pages</strong>, change the folder from <strong>/(root)</strong> to <strong>/docs</strong> (or change Source to <strong>GitHub Actions</strong>).</p></div>';
          }
        }
      }, true);
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
